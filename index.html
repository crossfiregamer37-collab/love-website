<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Question ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f5);
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 42px;
            color: #d6336c;
            margin-bottom: 15px;
        }

        p {
            font-size: 24px;
            color: #555;
            margin-bottom: 35px;
        }

        button {
            border: none;
            padding: 14px 30px;
            margin: 10px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        #yesButton {
            background: #ff4f81;
            color: white;
        }

        #noButton {
            background: white;
            color: #ff4f81;
            border: 2px solid #ff4f81;
            position: relative;
        }

        button:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>You are beautiful ❤️</h1>

        <p>Do you agree or not?</p>

        <button id="yesButton">YES ❤️</button>
        <button id="noButton">NO 😌</button>
    </div>

</body>
</html>
