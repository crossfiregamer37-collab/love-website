<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #fff5f8
            );

            overflow: hidden;
        }

        .container {
            padding: 30px;
            max-width: 700px;
        }

        h1 {
            font-size: clamp(40px, 8vw, 65px);
            color: #d6336c;

            margin-bottom: 20px;
        }

        p {
            font-size: clamp(20px, 4vw, 28px);
            line-height: 1.6;
            color: #555;
        }

        .heart {
            font-size: 70px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }

        #nextButton {

            margin-top: 25px;

            padding: 15px 35px;

            border: none;

            border-radius: 30px;

            background: #ff4f81;

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;

        }

        #nextButton:hover {
            transform: scale(1.1);
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="heart">
            ❤️
        </div>

        <h1>
            I knew it. 😌
        </h1>

        <p>
            I mean... you're beautiful, obviously. ❤️
            <br><br>

            But you're cute too,
            <strong>my love. 🥹</strong>
        </p>

        <button id="nextButton">
            NEXT 💕
        </button>

    </div>


    <script>

        document
            .getElementById("nextButton")
            .addEventListener("click", function() {

                window.location.href = "page3.html";

            });

    </script>

</body>

</html>
