<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Something For You ❤️</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e7,
                    #fff0f5
                );

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

        }


        /* CENTER CONTENT */

        .content {

            position: relative;

            z-index: 10;

            padding: 30px;

            max-width: 650px;

        }


        .big-heart {

            font-size: 75px;

            animation:
                heartbeat 1.2s infinite;

        }


        h1 {

            font-size:
                clamp(35px, 8vw, 60px);

            color: #d6336c;

            margin: 20px 0;

        }


        p {

            font-size:
                clamp(19px, 4vw, 25px);

            line-height: 1.6;

            color: #555;

        }


        #letterButton {

            margin-top: 25px;

            padding:
                15px 32px;

            border: none;

            border-radius: 30px;

            background: #ff4f81;

            color: white;

            font-size: 19px;

            cursor: pointer;

            transition: 0.2s;

        }


        #letterButton:hover {

            transform: scale(1.1);

        }


        /* FALLING HEARTS */

        .heart {

            position: fixed;

            top: -50px;

            pointer-events: none;

            z-index: 1;

            animation:
                fall linear forwards;

        }


        @keyframes fall {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;

            }


            100% {

                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0;

            }

        }


        @keyframes heartbeat {

            0% {

                transform: scale(1);

            }


            50% {

                transform: scale(1.2);

            }


            100% {

                transform: scale(1);

            }

        }

    </style>

</head>


<body>


    <!-- CENTER -->

    <div class="content">

        <div class="big-heart">
            ❤️
        </div>


        <h1>
            There's something I want to tell you...
        </h1>


        <p>

            So before we go any further...

            <br>

            I made something just for you. 💌

        </p>


        <button id="letterButton">

            OPEN MY LETTER 💌

        </button>

    </div>



    <script>


        // CREATE FALLING HEARTS

        function createHeart() {


            const heart =
                document.createElement("div");


            heart.classList.add("heart");


            const hearts = [
                "❤️",
                "💕",
                "💗",
                "💖",
                "💓",
                "💞"
            ];


            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random()
                        * hearts.length
                    )
                ];


            // Random position

            heart.style.left =
                Math.random() * 100 + "vw";


            // Random size

            const size =
                Math.random() * 25 + 15;

            heart.style.fontSize =
                size + "px";


            // Random falling speed

            const duration =
                Math.random() * 4 + 4;

            heart.style.animationDuration =
                duration + "s";


            document.body.appendChild(heart);


            // Remove after animation

            setTimeout(function() {

                heart.remove();

            }, duration * 1000);

        }



        // New heart every 250ms

        setInterval(
            createHeart,
            250
        );



        // LETTER BUTTON

        document
            .getElementById("letterButton")
            .addEventListener(
                "click",
                function() {

                    window.location.href =
                        "letter.html";

                }
            );


    </script>


</body>

</html>
